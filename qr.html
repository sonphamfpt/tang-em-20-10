<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Mã QR Quà Tặng 20/10</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #ff4d6d;
            --primary-dark: #c9184a;
            --accent-gold: #ffd166;
            --bg-dark: #180d1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: radial-gradient(circle at 50% 20%, #2b0e27 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .qr-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 77, 109, 0.3);
        }

        .badge {
            display: inline-block;
            background: rgba(255, 77, 109, 0.2);
            border: 1px solid rgba(255, 77, 109, 0.4);
            color: #ffb3c1;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff, #ffb3c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.sub {
            font-size: 14px;
            color: #e2c2ce;
            margin-bottom: 24px;
        }

        /* Printable QR Gift Box */
        .printable-gift {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 20px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
            color: #2b1320;
        }

        .gift-tagline {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            color: #c9184a;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .gift-instruction {
            font-size: 13px;
            color: #7d4e5f;
            margin-bottom: 16px;
        }

        .qr-display-box {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 12px;
            border: 2px dashed #f1cbd2;
            border-radius: 12px;
            width: fit-content;
            margin: 0 auto;
        }

        #qrcode img, #qrcode canvas {
            display: block;
            border-radius: 6px;
        }

        .gift-footer {
            margin-top: 14px;
            font-size: 12px;
            color: #8c5b6c;
            font-style: italic;
        }

        /* Input Controls */
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #ffb3c1;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="qr-card">
        <div class="badge">🎁 CÔNG CỤ TẠO MÃ QR</div>
        <h1>Mã QR Quà Tặng 20/10</h1>
        <p class="sub">Nhập đường link web sau khi deploy lên GitHub Pages để tạo mã QR gửi người yêu!</p>

        <!-- The printable frame -->
        <div class="printable-gift" id="printableGift">
            <div class="gift-tagline">Quà bí mật tặng Em ✨</div>
            <div class="gift-instruction">Dùng camera điện thoại quét mã nhận quà nhé! 💌</div>
            <div class="qr-display-box">
                <div id="qrcode"></div>
            </div>
            <div class="gift-footer">❤️ Happy Vietnamese Women's Day 20/10 ❤️</div>
        </div>

        <!-- Input URL -->
        <div class="input-group">
            <label for="urlInput">Đường link trang web của bạn:</label>
            <input type="text" id="urlInput" placeholder="https://username.github.io/ten-repo/" value="https://nguoianhyeu.pages.dev/">
        </div>

        <div class="action-btns">
            <button class="btn btn-primary" id="btnDownload">💾 Tải ảnh Mã QR về máy</button>
            <a href="index.html" class="btn btn-secondary">👀 Xem thử trang thiệp chúc mừng</a>
        </div>
    </div>

    <script>
        const qrContainer = document.getElementById('qrcode');
        const urlInput = document.getElementById('urlInput');
        const btnDownload = document.getElementById('btnDownload');

        let qrCodeObj = null;

        function updateQR() {
            qrContainer.innerHTML = '';
            const targetUrl = urlInput.value.trim() || window.location.href.replace('qr.html', 'index.html');
            
            qrCodeObj = new QRCode(qrContainer, {
                text: targetUrl,
                width: 200,
                height: 200,
                colorDark: "#2b0e27",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        urlInput.addEventListener('input', updateQR);

        // Download QR image
        btnDownload.addEventListener('click', () => {
            const img = qrContainer.querySelector('img');
            if (img && img.src) {
                const link = document.createElement('a');
                link.download = 'ma-qr-tang-nguoi-yeu-20-10.png';
                link.href = img.src;
                link.click();
            } else {
                const canvas = qrContainer.querySelector('canvas');
                if (canvas) {
                    const link = document.createElement('a');
                    link.download = 'ma-qr-tang-nguoi-yeu-20-10.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }
            }
        });

        // Initial generation
        updateQR();
    </script>
</body>
</html>
